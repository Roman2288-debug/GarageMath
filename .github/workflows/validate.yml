name: GarageMath validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check common.js
          node --check calculations.js
          node --check calculator-page.js
          node --check calculator-details.js
          node --check home.js
          node --check garage.js
          node --check sw.js
      - name: Calculation tests
        run: npm test
